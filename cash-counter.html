<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Counter | Sagun Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,body{
    width:100%;
    min-height:100vh;
    background:#f4f6f9;
    overflow-x: hidden;
}

/* ऊपर वाली सुंदर हेडर पट्टी */
.header{
    width:100%;
    height:65px;
    background:linear-gradient(135deg, #500000, #800000);
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.25);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.headerLeft {
    display: flex;
    align-items: center;
    gap: 15px;
}

.menuToggle {
    background: none;
    border: none;
    color: #FFD700;
    font-size: 22px;
    cursor: pointer;
    display: none; /* डेस्कटॉप पर छुपा रहेगा */
}

.header-title{
    font-size:18px;
    font-weight:700;
    color:#FFD700;
    letter-spacing: 0.5px;
}

.header-btns{
    display:flex;
    gap:8px;
}

.logoutBtn {
    background: #FFD700;
    color: #800000;
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: .3s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.logoutBtn:hover {
    background: #fff;
    transform: translateY(-2px);
}

/* मुख्य लेआउट और साइडबार */
.main{
    display:flex;
    width:100%;
    min-height:calc(100vh - 65px);
    position: relative;
}

.sidebar{
    width:240px;
    background:#1a1a1a;
    display:flex;
    flex-direction:column;
    padding-top:20px;
    box-shadow: 4px 0 15px rgba(0,0,0,0.1);
    z-index: 999;
    transition: all 0.3s ease;
    flex-shrink: 0;
}

.sidebar a{
    color:#ccc;
    text-decoration:none;
    padding:14px 22px;
    font-size:14px;
    font-weight:500;
    border-left:4px solid transparent;
    transition:.3s;
    display: flex;
    align-items: center;
    gap: 12px;
}

.sidebar a:hover{
    background:#800000;
    color:#fff;
    border-left:4px solid #FFD700;
}

.sidebar a.active{
    background:#800000;
    color:#fff;
    border-left:4px solid #FFD700;
    font-weight: 600;
}

.container{
    flex:1;
    padding:20px;
    max-width:800px;
    margin:auto;
    width:100%;
    overflow-y: auto;
    padding-bottom: 60px;
}

.topCard, .summary, .counter{
    background:#fff;
    padding:15px;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.05);
    margin-bottom:15px;
    border: 1px solid #eaeaea;
}

.topCard h2, .counter h2{
    color:#800000;
    margin-bottom:6px;
    font-size:15px;
    font-weight:700;
}

.topCard input{
    width:100%;
    padding:10px;
    font-size:20px;
    font-weight:bold;
    color:#800000;
    text-align:center;
    border:1.5px solid #d4af37;
    border-radius:8px;
    outline:none;
    background:#fffcfc;
}

.summary{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    padding:12px 15px;
}

.summary .card{
    background: #fafafa;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #eee;
}

.summary .card h3{
    color:#666;
    margin-bottom:4px;
    font-size:12px;
    text-transform: uppercase;
}

.summary .card h1{
    font-size:20px;
    color:#800000;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    margin-top: 10px;
}

th{
    background:#800000;
    color:#FFD700;
    padding:10px;
    font-size:13px;
    text-align:center;
}

td{
    padding:8px 10px;
    border-bottom:1px solid #f1f1f1;
    text-align:center;
}

.qty{
    width:45px;
    height:28px;
    font-size:13px;
    text-align:center;
    border:1px solid #ccc;
    border-radius:4px;
    margin:0 6px;
    outline:none;
}

.qty:focus{
    border-color:#800000;
}

.plus, .minus{
    width:26px;
    height:26px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
    color:#fff;
    transition:0.2s;
}

.plus{background:#198754;}
.plus:hover{background:#157347;}
.minus{background:#dc3545;}
.minus:hover{background:#bb2d3b;}

.amount{
    font-size:13px;
    font-weight:bold;
    color:#198754;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.buttons button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

#resetBtn{background:#ffc107; color:#333;}
.buttons button:last-child{background:#0d6efd; color:#fff;}
.buttons button:hover{opacity:0.9; transform: translateY(-2px);}

.footer{
    width:100%;
    height:38px;
    background:#500000;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0 12px;
    color:#fff;
    font-size:11px;
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 999;
}

table tr{transition:.2s;}
table tr:hover{background:#fff8f2;}

/* केवल मोबाइल व्यू के लिए */
@media(max-width: 768px){
    .menuToggle { display: block; }
    .sidebar {
        position: fixed;
        left: -240px;
        top: 65px;
        height: calc(100vh - 65px);
    }
    .sidebar.active {
        left: 0;
    }
    .container { padding: 10px; }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const sb = window.supabase.createClient(
"https://rdlliurzgwwfjscgwssa.supabase.co",
"sb_publishable_HX1QmjO0SPyW3rUoihZkkQ_tRTE1bLc"
);
</script>

<body>
<div class="header">
    <div class="headerLeft">
        <button class="menuToggle" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="header-title">💵 Cash Counter</div>
    </div>
    <div class="header-btns">
        <button class="logoutBtn" id="logoutBtn">🚪 Logout</button>
    </div>
</div>

<div class="main">
    <!-- साइडबार -->
    <div class="sidebar" id="sidebar">
        <a href="home.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="entry.html"><i class="fa-solid fa-user-plus"></i> Shagun Entry</a>
        <a href="cash-counter.html" class="active"><i class="fa-solid fa-calculator"></i> Cash Counter</a>
        <a href="cashbook.html"><i class="fa-solid fa-book-open"></i> Cash In / Cash Out</a>
        <a href="report.html"><i class="fa-solid fa-chart-pie"></i> Report</a>
        <a href="admin.html"><i class="fa-solid fa-crown"></i> Super Admin</a>
    </div>

    <div class="container">
        <div class="topCard">
            <h2>Total System Amount</h2>
            <input type="text" id="targetAmount" readonly>
        </div>

        <div class="summary">
            <div class="card">
                <h3>Counted Cash</h3>
                <h1 id="totalCash">₹0</h1>
            </div>
            <div class="card">
                <h3>Difference</h3>
                <h1 id="difference">₹0</h1>
            </div>
        </div>

        <div class="counter">
            <h2>💰 Note Denomination</h2>
            <table>
                <tr><th>Note</th><th>Qty</th><th>Amount</th></tr>
                <tr><td>₹500</td><td><button class="minus">−</button><input class="qty" data-note="500" value="0"><button class="plus">+</button></td><td class="amount">₹0</td></tr>
                <tr><td>₹200</td><td><button class="minus">−</button><input class="qty" data-note="200" value="0"><button class="plus">+</button></td><td class="amount">₹0</td></tr>
                <tr><td>₹100</td><td><button class="minus">−</button><input class="qty" data-note="100" value="0"><button class="plus">+</button></td><td class="amount">₹0</td></tr>
                <tr><td>₹50</td><td><button class="minus">−</button><input class="qty" data-note="50" value="0"><button class="plus">+</button></td><td class="amount">₹0</td></tr>
                <tr><td>₹20</td><td><button class="minus">−</button><input class="qty" data-note="20" value="0"><button class="plus">+</button></td><td class="amount">₹0</td></tr>
                <tr><td>₹10</td><td><button class="minus">−</button><input class="qty" data-note="10" value="0"><button class="plus">+</button></td><td class="amount">₹0</td></tr>
                <tr><td>₹5</td><td><button class="minus">−</button><input class="qty" data-note="5" value="0"><button class="plus">+</button></td><td class="amount">₹0</td></tr>
                <tr><td>₹2</td><td><button class="minus">−</button><input class="qty" data-note="2" value="0"><button class="plus">+</button></td><td class="amount">₹0</td></tr>
                <tr><td>₹1</td><td><button class="minus">−</button><input class="qty" data-note="1" value="0"><button class="plus">+</button></td><td class="amount">₹0</td></tr>
            </table>

            <div class="buttons">
                <button id="resetBtn">🔄 Reset</button>
                <button onclick="window.print()">🖨 Print</button>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    <div>🌐 Visit us at <strong>www.sgunms.in</strong></div>
</div>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
}

const qtyInputs = document.querySelectorAll(".qty");
const target = document.getElementById("targetAmount");
const totalCash = document.getElementById("totalCash");
const difference = document.getElementById("difference");

function calculate(){
    let total = 0;
    qtyInputs.forEach(input=>{
        const note = Number(input.dataset.note);
        const qty = Number(input.value) || 0;
        const amount = note * qty;
        input.parentElement.nextElementSibling.innerHTML = "₹" + amount.toLocaleString("en-IN");
        total += amount;
    });
    totalCash.innerHTML = "₹" + total.toLocaleString("en-IN");
    const diff = dashboardCash - total;
    difference.innerHTML = "₹" + diff.toLocaleString("en-IN");
    const diffCard = difference.parentElement;
    if(diff == 0){
        difference.style.color = "#198754";
        diffCard.style.background = "#e8f5e9";
    } else if(diff > 0){
        difference.style.color = "#ff9800";
        diffCard.style.background = "#fff3cd";
    } else {
        difference.style.color = "#dc3545";
        diffCard.style.background = "#fdeaea";
    }
}

qtyInputs.forEach(input=>{ input.addEventListener("input", calculate); });
target.addEventListener("input", calculate);

document.querySelectorAll(".plus").forEach(btn=>{
    btn.onclick = function(){
        const input = this.previousElementSibling;
        input.value = Number(input.value || 0) + 1;
        calculate();
    };
});

document.querySelectorAll(".minus").forEach(btn=>{
    btn.onclick = function(){
        const input = this.nextElementSibling;
        let v = Number(input.value || 0);
        if(v > 0){ input.value = v - 1; }
        calculate();
    };
});

document.getElementById("resetBtn").onclick = function(){
    qtyInputs.forEach(input=>{
        input.value = 0;
        input.parentElement.nextElementSibling.innerHTML = "₹0";
    });
    target.value = "";
    calculate();
};

loadCurrentCash();

let dashboardCash = 0;

async function loadCurrentCash(){
    const {data:{user}} = await sb.auth.getUser();
    if(!user) return;

    // Cash Shagun
    const {data:guests=[]} = await sb
    .from("guests")
    .select("amount,payment_mode")
    .eq("user_id",user.id);

    let cashShagun = 0;
    guests.forEach(g=>{
        if(g.payment_mode !== "UPI"){
            cashShagun += Number(g.amount);
        }
    });

    // Cash History
    const {data:history=[]} = await sb
    .from("cash_history")
    .select("amount,type")
    .eq("user_id",user.id)
    .eq("status","active");

    let cashIn = 0;
    let cashOut = 0;
    history.forEach(h=>{
        if(h.type === "cash_in") cashIn += Number(h.amount);
        if(h.type === "cash_out") cashOut += Number(h.amount);
    });

    dashboardCash = cashShagun - cashOut + cashIn;
    document.getElementById("targetAmount").value = "₹" + dashboardCash.toLocaleString("en-IN");
    calculate();
}

document.getElementById("logoutBtn").onclick = async () => {
    await sb.auth.signOut();
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("login.html");
};
</script>
</body>
</html>
