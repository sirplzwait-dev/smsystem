<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Sagun Management System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #5b0000, #800000, #b8860b, #ffd700);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
    overflow: auto;
}

@keyframes bgMove{
    0%{background-position: 0% 50%;}
    50%{background-position: 100% 50%;}
    100%{background-position: 0% 50%;}
}

.box{
    width: 420px;
    max-width: 95%;
    padding: 25px;
    background: rgba(255, 255, 255, .15);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
    color: #fff;
}

h2{
    text-align: center;
    margin-bottom: 8px;
}

.subtitle{
    text-align: center;
    margin-bottom: 18px;
    line-height: 1.5;
}

.input{
    position: relative;
    margin-bottom: 12px;
}

.input input{
    width: 100%;
    height: 48px;
    padding-left: 45px;
    padding-right: 45px;
    border: none;
    outline: none;
    border-radius: 10px;
    font-size: 15px;
}

.icon{
    position: absolute;
    left: 15px;
    top: 13px;
    font-size: 18px;
}

.eye{
    position: absolute;
    right: 15px;
    top: 12px;
    cursor: pointer;
    font-size: 20px;
}

button{
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 10px;
    background: #FFD700;
    color: #800000;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

button:hover{
    transform: translateY(-2px);
}

.loader{
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255, 255, 255, .4);
    border-top: 3px solid #800000;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-right: 10px;
    vertical-align: middle;
}

@keyframes spin{
    100%{transform: rotate(360deg);}
}

.login{
    margin-top: 18px;
    text-align: center;
}

.login a{
    color: #FFD700;
    font-weight: bold;
    text-decoration: none;
}

.cf-turnstile{
    display: flex;
    justify-content: center;
    margin: 15px 0;
}
</style>

</head>

<body>

<div class="box">

    <h2>📝 Create Account</h2>

    <p class="subtitle">
        Register to continue<br>
        <b>Sagun Management System</b>
    </p>

    <div class="input">
        <span class="icon">👤</span>
        <input id="name" type="text" placeholder="Full Name">
    </div>

    <div class="input">
        <span class="icon">📍</span>
        <input id="state" type="text" placeholder="State">
    </div>

    <div class="input">
        <span class="icon">📱</span>
        <input id="mobile" type="text" placeholder="Mobile Number">
    </div>

    <div class="input">
        <span class="icon">📧</span>
        <input id="email" type="email" placeholder="Email Address">
    </div>

    <div class="input">
        <span class="icon">🔒</span>
        <input id="password" type="password" placeholder="Password">
        <span class="eye" id="eye1">👁️</span>
    </div>

    <div class="input">
        <span class="icon">🔒</span>
        <input id="confirmPassword" type="password" placeholder="Confirm Password">
        <span class="eye" id="eye2">👁️</span>
    </div>

    <div class="cf-turnstile" data-sitekey="0x4AAAAAADsJ5QnV0fxq-nS0"></div>

    <button id="registerBtn" onclick="registerUser()">
        📝 Register
    </button>

    <div class="login">
        Already have an account?<br>
        <a href="login.html">Login</a>
    </div>

</div>

<script>
const SUPABASE_URL = "https://rdlliurzgwwfjscgwssa.supabase.co";
const SUPABASE_KEY = "sb_publishable_HX1QmjO0SPyW3rUoihZkkQ_tRTE1bLc";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showLoading() {
    const btn = document.getElementById("registerBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="loader"></span> Please Wait...';
}

function hideLoading() {
    const btn = document.getElementById("registerBtn");
    btn.disabled = false;
    btn.innerHTML = "📝 Register";
}

document.getElementById("eye1").onclick = () => {
    const p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
};

document.getElementById("eye2").onclick = () => {
    const p = document.getElementById("confirmPassword");
    p.type = p.type === "password" ? "text" : "password";
};

async function registerUser() {
    showLoading();

    const name = document.getElementById("name").value.trim();
    const state = document.getElementById("state").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!name || !email || !password || !confirmPassword) {
        hideLoading();
        alert("Please fill all fields.");
        return;
    }

    if (password !== confirmPassword) {
        hideLoading();
        alert("Passwords do not match.");
        return;
    }

    try {
        const { data, error } = await sb.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    name: name,
                    state: state,
                    mobile: mobile
                }
            }
        });

        console.log("DATA =", data);
        console.log("ERROR =", error);

        if (error) {
            hideLoading();
            alert(error.message);
            return;
        }

        if (!data || !data.user) {
            hideLoading();
            alert("Registration failed. Please try again after a few minutes.");
            return;
        }

        const session = sb.auth.getSession();

        const response = await fetch(
            "https://rdlliurzgwwfjscgwssa.supabase.co/functions/v1/send-otp",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY
                },
                body: JSON.stringify({
                    name,
                    email,
                    user_id: data.user.id
                })
            }
        );

        const result = await response.json();
        console.log("Welcome Response:", response.status, result);

        if (!response.ok) {
            throw new Error(result.message || "Welcome email failed.");
        }

        hideLoading();
        window.location.href = "verify.html?email=" + encodeURIComponent(email);

    } catch (err) {
        hideLoading();
        alert(err.message);
    }
}
</script>

</body>
</html>
