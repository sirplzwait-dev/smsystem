<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Create New Password</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#600000,#800000,#FFD700);
}

.box{
width:380px;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
text-align:center;
}

h2{
color:#800000;
margin-bottom:10px;
}

p{
color:#555;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#FFD700;
color:#800000;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Create New Password</h2>

<p>Enter your new password.</p>

<input
type="password"
id="password"
placeholder="New Password">

<input
type="password"
id="confirm"
placeholder="Confirm Password">

<button onclick="resetPassword()">
Update Password
</button>

</div>

<script>

const email =
new URLSearchParams(location.search).get("email");

async function resetPassword(){

const password =
document.getElementById("password").value.trim();

const confirm =
document.getElementById("confirm").value.trim();

if(password.length<6){

alert("Password must be at least 6 characters.");

return;

}

if(password!==confirm){

alert("Passwords do not match.");

return;

}

const response =
await fetch(
"https://rdlliurzgwwfjscgwssa.supabase.co/functions/v1/reset-password",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
password

})

}

);

const result =
await response.json();

if(!response.ok){

alert(result.error||result.message);

return;

}

alert("Password updated successfully.");

window.location.href="login.html";

}

</script>

</body>
</html>
