<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reminder List | SGUNMS</title><link rel="stylesheet" href="../css/modules.css"><link rel="stylesheet" href="../css/topbar.css"><link rel="stylesheet" href="../css/reminders.css"><link rel="stylesheet" href="../css/sgunms-global-background.css">
</head><body><main class="rem-page"><div class="rem-wrap"><section class="rem-hero list-hero"><div><span class="kicker">🔔 SGUNMS REMINDER</span><h1 id="listTitle">Reminders</h1><p id="listSubtitle">सभी reminders</p></div><button id="listAddBtn" class="primary-btn">＋ Reminder जोड़ें</button></section><section class="group-detail standalone-list"><div class="group-detail-head"><div><h2 id="listHeading">सभी</h2><p id="listCount"></p></div><a class="ghost-btn" href="reminders.html">← Reminders</a></div><div id="listItems" class="group-detail-list"></div></section></div></main><div id="remModal" class="modal" hidden><div class="modal-card"><button class="modal-close" data-close>×</button><h2>Reminder जोड़ें</h2><form id="remForm"><input type="hidden" id="remId"><label>Reminder Type *</label><select id="remType" required></select><label>नाम / Title *</label><input id="remTitle" required><label>तारीख *</label><input id="remDate" type="date" required><label>समय</label><input id="remTime" type="time"><label class="check"><input id="allDay" type="checkbox" checked> पूरा दिन</label><label>Alert</label><select id="remAlert"><option value="0">कार्यक्रम के दिन</option><option value="1">1 दिन पहले</option><option value="3">3 दिन पहले</option><option value="7">7 दिन पहले</option><option value="15">15 दिन पहले</option><option value="30">1 महीना पहले</option></select><label class="check"><input id="repeatYearly" type="checkbox"> 🔁 हर साल दोहराएँ</label><label>Notes</label><textarea id="remNotes" rows="3"></textarea><div class="modal-actions"><button type="button" class="ghost-btn" data-close>रद्द करें</button><button class="primary-btn" type="submit">💾 Save Reminder</button></div></form></div></div><div id="toast" class="toast"></div><script src="../js/reminders-list.js"></script></body></html>
