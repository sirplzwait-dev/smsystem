<style>
/* Sagun Register — Family Background */
html, body {
  min-height: 100%;
}
body {
  margin: 0 !important;
  min-height: 100vh !important;
  background-color: #fff8f3 !important;
  background-image:
    linear-gradient(rgba(255,248,243,.18), rgba(255,248,243,.18)),
    url("../assets/images/register-family-bg.png") !important;
  background-size: cover !important;
  background-position: center center !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  overflow-y: auto !important;
  padding: 28px 18px !important;
  box-sizing: border-box !important;
}
.box {
  position: relative !important;
  z-index: 2 !important;
  margin: auto !important;
}
@media (max-width: 600px) {
  body {
    background-attachment: scroll !important;
    background-position: 35% center !important;
    padding: 18px 12px !important;
  }
  .box {
    width: min(100%, 430px) !important;
  }
}
</style>


<style>
/* Compact readable register layout */
html,body{width:100%;min-height:100%;}
body{
  min-height:100vh!important;
  margin:0!important;
  padding:10px 14px!important;
  box-sizing:border-box!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  overflow-y:auto!important;
  color:#3b1f2b!important;
}
.box{
  width:min(430px,100%)!important;
  max-height:calc(100vh - 20px)!important;
  box-sizing:border-box!important;
  margin:0 auto!important;
  padding:18px 20px!important;
  border-radius:22px!important;
  background:rgba(255,250,247,.88)!important;
  border:1px solid rgba(185,89,105,.25)!important;
  box-shadow:0 16px 45px rgba(95,45,55,.22)!important;
  overflow-y:auto!important;
  scrollbar-width:thin;
  color:#3b1f2b!important;
}
.box h2{margin:0 0 5px!important;color:#8f2345!important;font-size:27px!important;line-height:1.15!important;text-align:center!important;}
.box .subtitle{margin:0 0 10px!important;color:#5f4650!important;font-size:13px!important;line-height:1.35!important;text-align:center!important;}
.box .subtitle b{color:#8f2345!important;}
.box .input{height:40px!important;min-height:40px!important;margin:6px 0!important;border-radius:11px!important;background:#fff!important;border:1px solid #ead7dc!important;box-shadow:none!important;box-sizing:border-box!important;}
.box .input input{height:100%!important;color:#3b1f2b!important;font-size:14px!important;background:transparent!important;}
.box .input input::placeholder{color:#7b6b72!important;opacity:1!important;}
.box .icon{color:#7d2850!important;}
.box .eye{color:#6b4a55!important;}
.box .cf-turnstile{margin:7px auto!important;transform:scale(.9);transform-origin:center;}
#registerBtn,.box button{min-height:42px!important;height:42px!important;margin:7px 0!important;border-radius:11px!important;font-size:15px!important;font-weight:700!important;}
.box .or-divider{margin:5px 0!important;color:#765b64!important;}
.box .google-btn{margin:5px 0!important;}
.box .login{margin:7px 0 0!important;color:#66525a!important;font-size:12px!important;line-height:1.3!important;text-align:center!important;}
.box .login a{color:#9b2349!important;font-weight:700!important;}
@media(max-width:600px){
  body{padding:7px 9px!important;align-items:center!important;background-position:38% center!important;}
  .box{width:min(420px,100%)!important;max-height:calc(100vh - 14px)!important;padding:14px 15px!important;border-radius:18px!important;}
  .box h2{font-size:23px!important;margin-bottom:3px!important;}
  .box .subtitle{font-size:12px!important;margin-bottom:7px!important;}
  .box .input{height:37px!important;min-height:37px!important;margin:4px 0!important;}
  .box .input input{font-size:13px!important;}
  .box .cf-turnstile{transform:scale(.78);margin:3px auto!important;}
  #registerBtn,.box button{height:39px!important;min-height:39px!important;margin:5px 0!important;font-size:14px!important;}
  .box .or-divider{margin:2px 0!important;}
  .box .login{margin-top:4px!important;}
}
</style>


<style>
/* Final polished register UI */
html,body{width:100%;min-height:100%;}
body{
  min-height:100vh!important; margin:0!important; padding:18px!important; box-sizing:border-box!important;
  display:flex!important; align-items:center!important; justify-content:center!important;
  overflow:hidden!important; color:#3b1f2b!important;
}
.box{
  width:min(500px,100%)!important; max-height:calc(100vh - 36px)!important;
  box-sizing:border-box!important; margin:0 auto!important; padding:20px 22px!important;
  border-radius:24px!important; background:rgba(255,250,247,.94)!important;
  border:1px solid rgba(174,91,110,.28)!important; box-shadow:0 18px 48px rgba(78,39,48,.22)!important;
  overflow-y:auto!important; scrollbar-width:thin; color:#3b1f2b!important;
}
.box h2{margin:0 0 4px!important;color:#8f2345!important;font-size:28px!important;line-height:1.15!important;text-align:center!important;}
.box .subtitle{margin:0 0 11px!important;color:#66515a!important;font-size:13px!important;line-height:1.35!important;text-align:center!important;}
.box .subtitle b{color:#8f2345!important;}
.box .input{height:43px!important;min-height:43px!important;margin:6px 0!important;border-radius:12px!important;background:#fff!important;border:1.5px solid #d9c7cd!important;box-shadow:0 1px 3px rgba(80,40,50,.06)!important;box-sizing:border-box!important;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;}
.box .input:focus-within{height:47px!important;min-height:47px!important;border-color:#d73567!important;box-shadow:0 0 0 3px rgba(215,53,103,.12)!important;transform:scaleY(1.015)!important;}
.box .input input{height:100%!important;color:#2f2227!important;font-size:14px!important;background:transparent!important;outline:none!important;}
.box .input input::placeholder{color:#75666d!important;opacity:1!important;}
.box .cf-turnstile{margin:7px auto!important;transform:scale(.9);transform-origin:center;}
#registerBtn,.box button{min-height:43px!important;height:43px!important;margin:7px 0!important;border-radius:12px!important;font-size:15px!important;font-weight:700!important;}
.box .or-divider{margin:4px 0!important;color:#765b64!important;}
.box .google-btn{margin:5px 0!important;}
.box .login{margin:6px 0 0!important;color:#66525a!important;font-size:12px!important;line-height:1.3!important;text-align:center!important;}
.box .login a{color:#9b2349!important;font-weight:700!important;}
@media(max-width:600px){
  body{padding:8px!important;overflow:hidden!important;background-position:38% center!important;}
  .box{width:min(430px,100%)!important;max-height:calc(100vh - 16px)!important;padding:15px 16px!important;border-radius:19px!important;}
  .box h2{font-size:24px!important;margin-bottom:3px!important;}
  .box .subtitle{font-size:12px!important;margin-bottom:7px!important;}
  .box .input{height:39px!important;min-height:39px!important;margin:4px 0!important;}
  .box .input:focus-within{height:43px!important;min-height:43px!important;}
  .box .input input{font-size:13px!important;}
  .box .cf-turnstile{transform:scale(.78);margin:3px auto!important;}
  #registerBtn,.box button{height:40px!important;min-height:40px!important;margin:5px 0!important;font-size:14px!important;}
}
@media(max-height:700px){
  body{overflow:hidden!important;}
  .box{padding-top:12px!important;padding-bottom:12px!important;}
  .box h2{font-size:23px!important;}
  .box .input{height:37px!important;min-height:37px!important;margin:3px 0!important;}
  .box .input:focus-within{height:41px!important;min-height:41px!important;}
  #registerBtn,.box button{height:38px!important;min-height:38px!important;margin:4px 0!important;}
}
</style>

</head>

<body>

<div class="box">

    <h2>Create Account</h2>

    <p class="subtitle">
        Register to continue<br>
        <b>Sagun Management System</b>
    </p>

    <div class="input">
        <input id="name" type="text" placeholder="Full Name">
    </div>

    <div class="input">
        <input id="state" type="text" placeholder="State">
    </div>

    <div class="input">
        <input id="mobile" type="text" placeholder="Mobile Number">
    </div>

    <div class="input">
        <input id="email" type="email" placeholder="Email Address">
    </div>

    <div class="input">
        <input id="password" type="password" placeholder="Password">
        <span class="eye" id="eye1" aria-label="Show password"></span>
    </div>

    <div class="input">
        <input id="confirmPassword" type="password" placeholder="Confirm Password">
        <span class="eye" id="eye2" aria-label="Show password"></span>
    </div>

    <div class="cf-turnstile" data-sitekey="0x4AAAAAADsJ5QnV0fxq-nS0"></div>

    <button id="registerBtn" type="button">
        Register
    </button>

    <div class="or-divider"><span>या</span></div>

    <button id="googleBtn" class="google-btn" type="button">
        <span class="google-icon">G</span> Sign in with Google
    </button>

    <div class="login">
        Already have an account?<br>
        <a href="login.html">Login</a>
    </div>

</div>



    <script src="../js/register.js" defer></script>
  <script src="../js/process-ui.js" data-sagun-process-js="1"></script>
</body>

  padding-right: 16px !important;
}

  text-align: left !important;
}
</style>
