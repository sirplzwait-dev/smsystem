<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Email Verification</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



    <link rel="stylesheet" href="../css/verify.css">
<script src="offline-test.js"></script>
  <link rel="stylesheet" href="../css/premium-calendar.css">
<link rel="stylesheet" href="../css/sgunms-global-background.css">
</head>

<body>

<div class="box">

<h2>Email Verification</h2>

<p>
An OTP has been sent to your registered email address.
Please enter the 6-digit OTP to continue.
</p>

<input
id="otp"
maxlength="6"
placeholder="Enter OTP">

<button
class="verifyBtn"
onclick="verifyOtp()">
Verify OTP
</button>

<button
id="resend"
onclick="resendOtp()"
disabled>
Resend OTP (60)
</button>

</div>



    <script src="../js/verify.js" defer></script>
<script src="../js/premium-calendar.js"></script>
</body>

</html>
