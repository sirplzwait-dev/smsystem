<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sagun Report | Sagum Management System</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PSQRN0SV09"></script>


<!-- External Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <link rel="stylesheet" href="../css/report.css"">
<script src="offline-test.js"></script>
  <link rel="stylesheet" href="../css/topbar.css">
<link rel="stylesheet" href="../css/premium-calendar.css">
<link rel="stylesheet" href="../css/sgunms-global-background.css">
  <link rel="stylesheet" href="../css/process-ui.css">
</head>
<body>

<!-- Top Navigation Bar (Fixed / Freeze) -->
<div class="top-header-bar">
    <div class="headerLeft">
        <button class="menuToggle" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="top-title">📊 शगुन एवं गेस्ट रिपोर्ट</div>
    </div>
    <div class="header-btns">
        <button class="logoutBtn" id="logoutBtn">🚪 Logout</button>
    </div>
</div>

<div class="main">
    <!-- साइडबार -->
    <div class="sidebar" id="sidebar">
        <a href="home.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="entry.html"><i class="fa-solid fa-user-plus"></i> Shagun Entry</a>
        <a href="cash-counter.html"><i class="fa-solid fa-calculator"></i> Cash Counter</a>
        <a href="cashbook.html"><i class="fa-solid fa-book-open"></i> Cash In / Cash Out</a>
        <a href="report.html" class="active"><i class="fa-solid fa-chart-pie"></i> Report</a>
        <a href="admin.html"><i class="fa-solid fa-crown"></i> Super Admin</a>
    </div>

    <div class="main-wrapper">
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button onclick="exportExcel()" style="background:#27ae60;">📊 Excel Export</button>
            <button onclick="exportPDF()" style="background:#c0392b;">📄 PDF Export</button>
            <button onclick="backupData()" style="background:#2980b9;">💾 Backup</button>
        </div>

        <!-- Summary Cards -->
        <div class="summary-grid">
            <div class="summary-card">
                <h3>👥 कुल गेस्ट</h3>
                <h1 id="totalGuests">0</h1>
            </div>
            <div class="summary-card cash-card">
                <h3>💵 Cash Shagun</h3>
                <h1 id="cashShagun">₹0</h1>
            </div>
            <div class="summary-card upi-card">
                <h3>📱 UPI Shagun</h3>
                <h1 id="upiShagun">₹0</h1>
            </div>
            <div class="summary-card total-card">
                <h3>💰 कुल योग</h3>
                <h1 id="totalShagun">₹0</h1>
            </div>
        </div>

        <!-- Chart Toggle Section -->
        <div class="chart-toggle-section">
            <div class="chart-controls">
                <button class="chart-toggle-btn" id="toggleChartBtn" onclick="toggleChartBox()">📈 ग्राफ एवं विवरण देखें (Open Chart)</button>
                <select id="chartTypeSelect" onchange="renderSelectedChart()" style="display:none;">
                    <option value="mode">भुगतान माध्यम (Cash vs UPI)</option>
                    <option value="district">जिला वार (District Wise)</option>
                    <option value="village">गाँव वार (Village Wise)</option>
                </select>
            </div>
            <div class="chart-wrapper" id="chartBox">
                <canvas id="shagunChart"></canvas>
            </div>
            <!-- Numeric Breakdown Table -->
            <div class="numeric-breakdown" id="numericBreakdownBox">
                <table>
                    <thead>
                        <tr id="breakdownHead"><th>श्रेणी (Category)</th><th>राशि (Amount)</th></tr>
                    </thead>
                    <tbody id="breakdownBody"></tbody>
                </table>
            </div>
        </div>

        <div class="container" style="padding: 0;">
            <div class="card">
                <input type="text" id="villageFilter" placeholder="🔍 नाम, जिला या गाँव से खोजें...">

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>नाम</th>
                                <th>राज्य</th>
                                <th>जिला</th>
                                <th>गाँव</th>
                                <th>Event</th>
                                <th>Mode</th>
                                <th>शगुन राशि</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="6" style="text-align: center; color: #888; padding: 20px;">डेटा लोड हो रहा है...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Footer Bar -->
<div class="footer">
    <div>🌐 Visit us at <strong>www.sgunms.in</strong></div>
</div>


<script src="../js/visitor.js""></script>
    <script src="../js/guest-auth.js"></script>
<script src="../js/report.js"" defer></script>
  <script src="../js/topbar.js"></script>
<script src="../js/premium-calendar.js"></script>
  <script src="../js/process-ui.js"></script>
</body>
</html>
