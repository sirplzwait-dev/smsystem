<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile | SGUNMS</title>
<link rel="stylesheet" href="../css/topbar.css">
<link rel="stylesheet" href="../css/modules.css">
<link rel="stylesheet" href="../css/sgunms-global-background.css">
<style>
:root{--maroon:#7d1235;--gold:#d7a61b;--ink:#1f2937;--muted:#64748b;--card:#fff;--soft:#fff8ef}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff7f3 url("../assets/images/auth-family-bg.png") center/cover fixed no-repeat;min-height:100vh}
.settings-single{max-width:980px;margin:0 auto;padding:34px 20px 60px}
.settings-single .hero{background:linear-gradient(135deg,#fff8ee,#fffdf9);border:1px solid #ead7bd;border-radius:26px;padding:30px;box-shadow:0 18px 50px rgba(60,40,20,.09);position:relative;overflow:hidden}
.settings-single .hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-60px;background:rgba(215,166,27,.10)}
.kicker{display:inline-flex;align-items:center;gap:7px;color:#9a3b17;font-size:12px;font-weight:900;letter-spacing:2px}
.hero h1{font-size:36px;line-height:1.1;margin:10px 0 8px}
.hero p{margin:0;color:#667085;font-size:15px}
.panel-card{margin-top:22px;background:#fff;border:1px solid #eadfd5;border-radius:22px;padding:28px;box-shadow:0 14px 40px rgba(31,41,55,.08)}
.panel-title{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.panel-icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:#fff3dd;font-size:27px}
.panel-title h2{margin:0;font-size:23px}.panel-title small{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-grid label{display:flex;flex-direction:column;gap:8px;font-weight:800;font-size:14px}
.form-grid .full{grid-column:1/-1}
input{width:100%;padding:13px 14px;border:1px solid #ddd5cc;border-radius:13px;font-size:15px;outline:none;background:#fff}
input:focus{border-color:#b77b25;box-shadow:0 0 0 3px rgba(183,123,37,.12)}
.action-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.sg-btn{border:0;border-radius:12px;padding:12px 17px;background:var(--maroon);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 7px 18px rgba(125,18,53,.16)}
.sg-btn.alt{background:#f4eee8;color:#5b3b27}.sg-btn.danger{background:#b4232d}.sg-btn:disabled{opacity:.6;cursor:not-allowed}
.status{min-height:22px;margin-top:12px;color:#25753d;font-weight:700}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.info-box{padding:17px;border-radius:16px;background:#faf7f3;border:1px solid #eee3d8}
.info-box b{display:block;margin-bottom:5px}.info-box small{color:var(--muted)}
.warning{padding:16px;border-radius:15px;background:#fff4f4;border:1px solid #f2c5ca;color:#7b1e2b;line-height:1.55;margin-bottom:18px}
.back-link{display:inline-flex;margin-top:18px;text-decoration:none;color:var(--maroon);font-weight:800}
@media(max-width:700px){.settings-single{padding:20px 12px 40px}.hero h1{font-size:28px}.panel-card{padding:20px}.form-grid,.info-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}
</style>

<style id="sagun-auth-theme-final">
:root{--sagun-maroon:#8b2448;--sagun-pink:#e58aa6;--sagun-gold:#f2b900;--sagun-ink:#2f2730;--sagun-muted:#6f6670;}
html,body{min-height:100%;}
body{margin:0;background:#fff7f3 url("../assets/images/auth-family-bg.png") center/cover fixed no-repeat;color:var(--sagun-ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;}
body::before{content:"";position:fixed;inset:0;background:rgba(255,249,246,.46);backdrop-filter:blur(1.5px);z-index:-1;}
.box{width:min(460px,calc(100vw - 28px));margin:clamp(18px,5vh,54px) auto 24px;padding:24px 24px 22px;border:1px solid rgba(255,255,255,.88);border-radius:24px;background:rgba(255,250,248,.91);box-shadow:0 18px 55px rgba(86,42,50,.18);backdrop-filter:blur(10px);color:var(--sagun-ink);}
.box h2{margin:0 0 8px;text-align:center;color:var(--sagun-maroon);font-size:clamp(24px,4vw,32px);line-height:1.15;}
.box p,.box>p{margin:0 0 18px;text-align:center;color:#5d535a;line-height:1.5;}
.box input,.box textarea,.box select{width:100%;box-sizing:border-box;text-align:left;padding:12px 14px;margin:0 0 11px;border:1.5px solid #decfd2;border-radius:13px;background:#fffdfd;color:#302a30;font-size:15px;line-height:1.25;outline:none;box-shadow:0 3px 10px rgba(85,45,55,.05);transition:.18s ease;}
.box input::placeholder{color:#7b7278;opacity:1;text-align:left;}
.box input:focus,.box textarea:focus,.box select:focus{border-color:#d65d83;background:#fff8fb;box-shadow:0 0 0 3px rgba(214,93,131,.14);transform:translateY(-1px);}
.box button{width:100%;border:0;border-radius:13px;padding:12px 14px;margin-top:4px;background:linear-gradient(135deg,#ffd21a,#ffbd00);color:#5b2100;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(245,180,0,.22);}
.box button:hover{filter:brightness(1.03);transform:translateY(-1px);}
.box a{color:var(--sagun-maroon);font-weight:700;}
#resend{background:#fff;color:var(--sagun-maroon);border:1.5px solid #efc3cf;box-shadow:none;}
@media(max-width:600px){body{background-position:center center;background-attachment:scroll;}body::before{background:rgba(255,249,246,.62);}.box{width:calc(100vw - 24px);margin:12px auto 16px;padding:19px 16px;border-radius:20px;max-height:calc(100vh - 24px);overflow-y:auto;}.box h2{font-size:24px}.box input,.box textarea,.box select{padding:11px 13px;margin-bottom:9px;font-size:14px}.box button{padding:11px 13px;font-size:14px;}}
/* Profile page */
.settings-single{max-width:980px;margin:0 auto;padding:26px 16px 40px;}
.settings-single .hero,.settings-single .panel-card{background:rgba(255,250,248,.92)!important;backdrop-filter:blur(10px);}
.settings-single input{background:#fffdfd!important;color:#302a30!important;text-align:left!important;border:1.5px solid #decfd2!important;}
.settings-single input:focus{border-color:#d65d83!important;background:#fff8fb!important;box-shadow:0 0 0 3px rgba(214,93,131,.14)!important;}
@media(max-width:700px){.settings-single{padding:16px 12px 30px}.settings-single .hero h1{font-size:28px}}
</style>
</head>
<body>
<main class="settings-single">
<section class="hero">
<span class="kicker">⚙️ SGUNMS PROFILE</span>
<h1>👤 Profile</h1>
<p>नाम, Mobile और Village / City</p>
</section>
<section class="panel-card">

<div class="panel-title"><div class="panel-icon">👤</div><div><h2>Profile Information</h2><small>अपनी basic profile information update करें</small></div></div>
<div class="form-grid">
<label>नाम<input id="profileName" type="text" placeholder="अपना नाम"></label>
<label>Mobile<input id="profileMobile" type="tel" inputmode="numeric" placeholder="Mobile number"></label>
<label class="full">Village / City<input id="profilePlace" type="text" placeholder="गाँव / शहर"></label>
</div>
<div class="action-row"><button class="sg-btn" id="saveProfile">💾 Save Profile</button></div>
<div class="status" id="profileStatus"></div>
<div class="info-box" style="margin-top:20px"><b id="profileDisplayName">Guest</b><small id="profileMode">Local / Guest mode</small></div>

</section>
<a class="back-link" href="home.html">← Home पर वापस जाएँ</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/topbar.js"></script>
<script src="../js/settings-pages.js"></script>
</body>
</html>
