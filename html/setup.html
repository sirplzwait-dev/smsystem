<style>
/* Premium Event Cards */
#eventCardGrid{
  grid-template-columns:repeat(5,minmax(225px,1fr))!important;
  gap:30px!important;
  width:100%;
  margin:34px auto!important;
  align-items:stretch;
}

#eventCardGrid .event-card{
  position:relative;
  min-height:300px!important;
  padding:34px 22px!important;
  border-radius:30px!important;
  border:2px solid transparent!important;
  overflow:hidden;
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  text-align:center!important;
  cursor:pointer;
  background:#fff!important;
  box-shadow:0 14px 34px rgba(30,35,55,.14)!important;
  transition:transform .28s ease,box-shadow .28s ease,filter .28s ease!important;
}

#eventCardGrid .event-card::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.13;
  pointer-events:none;
}

#eventCardGrid .event-card::after{
  content:"";
  position:absolute;
  top:-55px;
  right:-55px;
  width:150px;
  height:150px;
  border-radius:50%;
  opacity:.16;
  pointer-events:none;
}

#eventCardGrid .event-card:hover{
  transform:translateY(-10px) scale(1.025);
  box-shadow:0 24px 48px rgba(25,30,55,.22)!important;
  filter:saturate(1.08);
}

#eventCardGrid .event-card:active{
  transform:translateY(-3px) scale(.995);
}

#eventCardGrid .event-emoji{
  position:relative;
  z-index:1;
  font-size:78px!important;
  line-height:1!important;
  margin-bottom:24px!important;
  filter:drop-shadow(0 7px 8px rgba(0,0,0,.14));
}

#eventCardGrid .event-card strong{
  position:relative;
  z-index:1;
  font-size:23px!important;
  font-weight:800!important;
  line-height:1.3!important;
  margin-bottom:11px!important;
}

#eventCardGrid .event-card small{
  position:relative;
  z-index:1;
  font-size:15px!important;
  font-weight:600;
  line-height:1.45!important;
  opacity:.75;
}

/* Marriage - royal red/gold */
#eventCardGrid .event-card[data-event="marriage"]{
  background:linear-gradient(145deg,#fff8f7,#fff0eb)!important;
  border-color:#e8b4a8!important;
}
#eventCardGrid .event-card[data-event="marriage"]::before{background:linear-gradient(135deg,#b91c1c,#f59e0b)}
#eventCardGrid .event-card[data-event="marriage"]::after{background:#b91c1c}

/* Engagement - diamond blue */
#eventCardGrid .event-card[data-event="engagement"]{
  background:linear-gradient(145deg,#f7fbff,#eaf4ff)!important;
  border-color:#a9cfee!important;
}
#eventCardGrid .event-card[data-event="engagement"]::before{background:linear-gradient(135deg,#2563eb,#67e8f9)}
#eventCardGrid .event-card[data-event="engagement"]::after{background:#2563eb}

/* Griha Pravesh - auspicious green */
#eventCardGrid .event-card[data-event="griha_pravesh"]{
  background:linear-gradient(145deg,#f7fff9,#e8f8ed)!important;
  border-color:#a8d5b5!important;
}
#eventCardGrid .event-card[data-event="griha_pravesh"]::before{background:linear-gradient(135deg,#15803d,#f59e0b)}
#eventCardGrid .event-card[data-event="griha_pravesh"]::after{background:#15803d}

/* Anniversary - floral purple/pink */
#eventCardGrid .event-card[data-event="anniversary"]{
  background:linear-gradient(145deg,#fff8fd,#f9edfa)!important;
  border-color:#dfb6dc!important;
}
#eventCardGrid .event-card[data-event="anniversary"]::before{background:linear-gradient(135deg,#be185d,#9333ea)}
#eventCardGrid .event-card[data-event="anniversary"]::after{background:#be185d}

/* Birthday - festive orange/yellow */
#eventCardGrid .event-card[data-event="birthday"]{
  background:linear-gradient(145deg,#fffaf2,#fff0d5)!important;
  border-color:#f0c67a!important;
}
#eventCardGrid .event-card[data-event="birthday"]::before{background:linear-gradient(135deg,#ea580c,#facc15)}
#eventCardGrid .event-card[data-event="birthday"]::after{background:#ea580c}

/* Responsive */
@media(max-width:1400px){
  #eventCardGrid{grid-template-columns:repeat(3,minmax(225px,1fr))!important}
}
@media(max-width:850px){
  #eventCardGrid{grid-template-columns:repeat(2,minmax(190px,1fr))!important;gap:20px!important}
  #eventCardGrid .event-card{min-height:260px!important;padding:28px 16px!important}
  #eventCardGrid .event-emoji{font-size:66px!important}
}
@media(max-width:500px){
  #eventCardGrid{grid-template-columns:1fr 1fr!important;gap:14px!important}
  #eventCardGrid .event-card{min-height:220px!important;padding:22px 10px!important;border-radius:22px!important}
  #eventCardGrid .event-emoji{font-size:54px!important;margin-bottom:17px!important}
  #eventCardGrid .event-card strong{font-size:17px!important}
  #eventCardGrid .event-card small{font-size:12px!important}
}
</style>
