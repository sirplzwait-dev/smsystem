<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events | SGUNMS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/modules.css"><link rel="stylesheet" href="../css/topbar.css"><link rel="stylesheet" href="../css/premium-calendar.css">
<link rel="stylesheet" href="../css/sgunms-global-background.css">
  <link rel="stylesheet" href="../css/process-ui.css">
</head><body><main class="module-page"><div class="module-wrap"><section class="module-hero"><span class="kicker">🎉 EVENT MANAGEMENT</span><h1>Events / समारोह</h1><p>एक ही account में कई समारोह सुरक्षित रखें।</p><div class="module-actions"><a class="sg-btn alt" href="home.html">⌂ Home</a></div></section><section class="sg-panel"><h2>➕ नया Event</h2><form id="eventForm" class="sg-form"><div><label>Event Type</label><select name="type" required><option value="Wedding">Wedding</option><option value="Tilak">Tilak</option><option value="Barat">Barat</option><option value="Reception">Reception</option><option value="Birthday">Birthday</option><option value="Anniversary">Anniversary</option><option value="Mundan">Mundan</option><option value="Griha Pravesh">Griha Pravesh</option></select></div><div><label>Event Name</label><input name="name" placeholder="जैसे राहुल की शादी" required></div><div><label>Event Date</label><input id="eventDate" name="date" type="date" required></div><div><label>Venue</label><input name="venue" placeholder="स्थान"></div><div><label>Host</label><input name="host" placeholder="आयोजक / परिवार"></div><div class="full"><label>Notes</label><textarea name="notes" rows="3" placeholder="अन्य जानकारी"></textarea></div><div class="full"><button class="sg-btn" type="submit">💾 Event Save करें</button></div></form></section><section class="sg-panel"><h2>📅 मेरे Events</h2><div id="eventList" class="sg-list"></div></section></div></main><script src="../js/modules.js"></script><script src="../js/topbar.js"></script><script src="../js/premium-calendar.js"></script>
  <script src="../js/process-ui.js"></script>
</body></html>
