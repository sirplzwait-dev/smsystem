<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Assistant | SGUNMS</title>
<link rel="stylesheet" href="../css/modules.css"><link rel="stylesheet" href="../css/topbar.css"><link rel="stylesheet" href="../css/assistant.css">
<link rel="stylesheet" href="../css/premium-calendar.css">
<link rel="stylesheet" href="../css/sgunms-global-background.css">
  <link rel="stylesheet" href="../css/process-ui.css">
</head>
<body>
<main class="module-page"><div class="module-wrap">
<section class="module-hero"><span class="kicker">🤖 SGUNMS ASSISTANT</span><h1>AI Assistant</h1><p>अपने SGUNMS में सेव Family, Event और Shagun data से सवाल पूछें।</p></section>
<section class="assistant-box">
<form id="assistantForm" class="assistant-form"><input id="assistantInput" class="assistant-input" autocomplete="off" placeholder="जैसे: Tilak में Cash और UPI कितना है?"><button class="assistant-btn" type="submit">🔎 पूछें</button></form>
<div class="quick-title">💡 उदाहरण</div>
<div class="quick-grid">
<button type="button" class="quick-q" data-question="Tilak में Cash और UPI कितना है?">🪔 Tilak में Cash और UPI कितना है?</button>
<button type="button" class="quick-q" data-question="Barat में कितने guest आए?">🥁 Barat में कितने guest आए?</button>
<button type="button" class="quick-q" data-question="पिछले 3 events में कितना शगुन दिया?">🎁 पिछले 3 Shagun Diya entries</button>
<button type="button" class="quick-q" data-question="मेरे family members कौन हैं?">👨‍👩‍👧 मेरे Family Members</button>
</div>
<div id="answer" class="assistant-answer"><div class="assistant-empty">ऊपर सवाल लिखें या कोई उदाहरण दबाएँ।</div></div>
<button id="clearAnswer" type="button" class="assistant-clear">↺ साफ करें</button>
<p class="muted">यह Assistant browser में सेव SGUNMS data पर काम करता है; इंटरनेट वाला सामान्य AI chatbot नहीं है।</p>
</section></div></main>
<script src="../js/assistant.js"></script><script src="../js/topbar.js"></script>
<script src="../js/premium-calendar.js"></script>
  <script src="../js/process-ui.js"></script>
</body></html>
