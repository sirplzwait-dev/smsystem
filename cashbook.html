<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Book | Sagum Management System</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PSQRN0SV09"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-PSQRN0SV09');
</script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}
html,body{
    width:100%;
    min-height:100vh;
    background:#f4f6f9;
    overflow-x: hidden;
}

.header{
    width:100%;
    height:65px;
    background:linear-gradient(135deg, #500000, #800000);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    color:#fff;
    box-shadow:0 4px 20px rgba(0,0,0,0.25);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.headerLeft {
    display: flex;
    align-items: center;
    gap: 15px;
}

.menuToggle {
    background: none;
    border: none;
    color: #FFD700;
    font-size: 22px;
    cursor: pointer;
    display: none; /* डेस्कटॉप पर छुपा रहेगा */
}

.top-logo {
    font-size: 18px;
    font-weight: 700;
    color: #FFD700;
    letter-spacing: 0.5px;
}

.headerRight{
    display:flex;
    align-items:center;
    gap:12px;
}

.logoutBtn{
    background:#FFD700;
    color:#800000;
    border:none;
    border-radius:20px;
    padding:6px 14px;
    font-weight:700;
    font-size: 12px;
    cursor:pointer;
    transition:.3s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.logoutBtn:hover{
    background:#fff;
    transform: translateY(-2px);
}

.main{
    display:flex;
    width:100%;
    min-height:calc(100vh - 65px);
    position: relative;
}

.sidebar{
    width:240px;
    background:#1a1a1a;
    display:flex;
    flex-direction:column;
    padding-top:20px;
    box-shadow: 4px 0 15px rgba(0,0,0,0.1);
    z-index: 999;
    transition: all 0.3s ease;
    flex-shrink: 0;
}

.sidebar a{
    color:#ccc;
    text-decoration:none;
    padding:14px 22px;
    font-size:14px;
    font-weight:500;
    border-left:4px solid transparent;
    transition:.3s;
    display: flex;
    align-items: center;
    gap: 12px;
}

.sidebar a:hover{
    background:#800000;
    color:#fff;
    border-left:4px solid #FFD700;
}

.sidebar a.active{
    background:#800000;
    color:#fff;
    border-left:4px solid #FFD700;
    font-weight: 600;
}

.content{
    flex:1;
    background:#f4f6f9;
    padding:20px;
    width: 100%;
    overflow-y: auto;
    max-width: 1000px;
    margin: auto;
    padding-bottom: 50px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:15px;
}
.card{
    background:#fff;
    padding:15px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.05);
    border: 1px solid #eaeaea;
    border-left:5px solid #800000;
}
.card h3{
    color:#666;
    font-size:12px;
    margin-bottom:6px;
    text-transform: uppercase;
}
.card h1{
    color:#800000;
    font-size:20px;
}
.forms{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:15px;
}
.box{
    background:#fff;
    padding:15px;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.05);
    border: 1px solid #eaeaea;
}
.box h2{
    font-size:16px;
    margin-bottom:12px;
    color:#800000;
    font-weight: 700;
}
input{
    width:100%;
    padding:10px 12px;
    margin-bottom:10px;
    border:1.5px solid #ddd;
    border-radius:8px;
    font-size:13px;
    outline:none;
    background:#fffcfc;
}
input:focus{
    border-color:#800000;
    box-shadow: 0 0 6px rgba(128,0,0,0.15);
}
button.cashInBtn, button.cashOutBtn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}
button.cashInBtn:hover, button.cashOutBtn:hover{
    opacity:0.9;
    transform: translateY(-2px);
}
.cashInBtn{
    background:#198754;
    color:#fff;
}
.cashOutBtn{
    background:#dc3545;
    color:#fff;
}
.history{
    background:#fff;
    padding:15px;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.05);
    border: 1px solid #eaeaea;
}
.history h2{
    font-size:16px;
    color:#800000;
    margin-bottom:12px;
    font-weight: 700;
}
#historyList{
    max-height:300px;
    overflow-y:auto;
    padding-right:4px;
}
.historyItem{
    background:#fafafa;
    border:1px solid #eee;
    border-left:4px solid #800000;
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:10px;
    font-size:12px;
}
.footer{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:38px;
    background:#500000;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0 12px;
    color:#fff;
    font-size:11px;
    z-index:999;
}

@media(max-width:768px){
    .menuToggle { display: block; } /* केवल मोबाइल पर 3-लाइन बटन दिखेगा */
    .sidebar {
        position: fixed;
        left: -240px;
        top: 65px;
        height: calc(100vh - 65px);
    }
    .sidebar.active { left: 0; }
    .cards{ grid-template-columns:1fr; gap:10px; }
    .forms{ grid-template-columns:1fr; gap:10px; }
    .content{ padding:10px; }
}
</style>
</head>
<body>

<div class="header">
    <div class="headerLeft">
        <button class="menuToggle" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="top-logo">💰 Cash Book</div>
    </div>
    <div class="headerRight">
        <button class="logoutBtn" id="logoutBtn">🚪 Logout</button>
    </div>
</div>

<div class="main">
    <div class="sidebar" id="sidebar">
        <a href="home.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="entry.html"><i class="fa-solid fa-user-plus"></i> Shagun Entry</a>
        <a href="cash-counter.html"><i class="fa-solid fa-calculator"></i> Cash Counter</a>
        <a href="cashbook.html" class="active"><i class="fa-solid fa-book-open"></i> Cash In / Cash Out</a>
        <a href="report.html"><i class="fa-solid fa-chart-pie"></i> Report</a>
        <a href="admin.html"><i class="fa-solid fa-crown"></i> Super Admin</a>
    </div>

    <div class="content">
        <div class="cards">
            <div class="card">
                <h3>Total Cash In</h3>
                <h1 id="cashInTotal">₹0</h1>
            </div>
            <div class="card">
                <h3>Total Cash Out</h3>
                <h1 id="cashOutTotal">₹0</h1>
            </div>
            <div class="card">
                <h3>Current Cash</h3>
                <h1 id="cashBalance">₹0</h1>
            </div>
        </div>

        <div class="forms">
            <div class="box">
                <h2>➕ Cash In</h2>
                <input id="inPerson" placeholder="Person Name">
                <input id="inPurpose" placeholder="Purpose">
                <input id="inAmount" type="number" placeholder="Amount">
                <button class="cashInBtn" id="saveCashIn">Save Cash In</button>
            </div>
            <div class="box">
                <h2>➖ Cash Out</h2>
                <input id="outPerson" placeholder="Person Name">
                <input id="outPurpose" placeholder="Purpose">
                <input id="outAmount" type="number" placeholder="Amount">
                <button class="cashOutBtn" id="saveCashOut">Save Cash Out</button>
            </div>
        </div>

        <div class="history">
            <h2>📜 Cash History</h2>
            <div id="historyList">No Record Found</div>
        </div>
    </div>
</div>

<div class="footer">
    <div>🌐 Visit us at <strong>www.sgunms.in</strong></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
}

const sb = window.supabase.createClient(
'https://rdlliurzgwwfjscgwssa.supabase.co',
'sb_publishable_HX1QmjO0SPyW3rUoihZkkQ_tRTE1bLc'
);

let currentUserId = null;

window.onload = async () => {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) {
        window.location.replace("login.html");
        return;
    }
    currentUserId = user.id;
    loadSummary();
    loadHistory();
};

async function loadSummary(){
    if (!currentUserId) return;

    const {data:cashIn=[]} = await sb.from("cash_history")
        .select("amount")
        .eq("user_id", currentUserId)
        .eq("type","cash_in")
        .eq("status","active");
    let totalIn = 0;
    cashIn.forEach(x => { totalIn += Number(x.amount); });

    const {data:cashOut=[]} = await sb.from("cash_history")
        .select("amount")
        .eq("user_id", currentUserId)
        .eq("type","cash_out")
        .eq("status","active");
    let totalOut = 0;
    cashOut.forEach(x => { totalOut += Number(x.amount); });

    document.getElementById("cashInTotal").innerHTML = "₹" + totalIn.toLocaleString("en-IN");
    document.getElementById("cashOutTotal").innerHTML = "₹" + totalOut.toLocaleString("en-IN");
    document.getElementById("cashBalance").innerHTML = "₹" + (totalIn - totalOut).toLocaleString("en-IN");
}

document.getElementById("saveCashIn").onclick = async () => {
    if (!currentUserId) return;
    const person = document.getElementById("inPerson").value.trim();
    const purpose = document.getElementById("inPurpose").value.trim();
    const amount = Number(document.getElementById("inAmount").value);

    if(person == "" || amount <= 0){
        alert("Please enter Person Name and Amount.");
        return;
    }

    const {error} = await sb.from("cash_history").insert([{
        user_id: currentUserId,
        person,
        purpose,
        amount,
        type: "cash_in",
        status: "active"
    }]);

    if(error){ alert(error.message); return; }

    document.getElementById("inPerson").value = "";
    document.getElementById("inPurpose").value = "";
    document.getElementById("inAmount").value = "";
    loadSummary();
    loadHistory();
};

document.getElementById("saveCashOut").onclick = async () => {
    if (!currentUserId) return;
    const person = document.getElementById("outPerson").value.trim();
    const purpose = document.getElementById("outPurpose").value.trim();
    const amount = Number(document.getElementById("outAmount").value);

    if(person == "" || amount <= 0){
        alert("Please enter Person Name and Amount.");
        return;
    }

    const {error} = await sb.from("cash_history").insert([{
        user_id: currentUserId,
        person,
        purpose,
        amount,
        type: "cash_out",
        status: "active"
    }]);

    if(error){ alert(error.message); return; }

    document.getElementById("outPerson").value = "";
    document.getElementById("outPurpose").value = "";
    document.getElementById("outAmount").value = "";
    loadSummary();
    loadHistory();
};

async function loadHistory(){
    if (!currentUserId) return;

    const {data=[]} = await sb.from("cash_history")
        .select("*")
        .eq("user_id", currentUserId)
        .eq("status","active")
        .order("created_at",{ascending:false})
        .limit(100);
        
    const box = document.getElementById("historyList");
    box.innerHTML = "";

    if(data.length == 0){
        box.innerHTML = "No Record Found";
        return;
    }

    data.forEach(x => {
        box.innerHTML += `
        <div class="historyItem">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
                <span><b>${x.type=="cash_in"?"🟢 Cash In":"🔴 Cash Out"}</b></span>
                <b style="font-size:13px;">₹${Number(x.amount).toLocaleString("en-IN")}</b>
            </div>
            <div><b>Person :</b> ${x.person}</div>
            ${x.purpose ? `<div><b>Purpose :</b> ${x.purpose}</div>` : ""}
            <div style="font-size:10px;color:#666;margin-top:3px;">${new Date(x.created_at).toLocaleString()}</div>
        </div>
        `;
    });
}

document.getElementById("logoutBtn").onclick = async () => {
    await sb.auth.signOut();
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("login.html");
};
</script>
<script src="js/visitor.js"></script>
</body>
</html>
