<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Forgot Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#600000,#800000,#FFD700);
}

.box{
width:380px;
background:#fff;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h2{
color:#800000;
margin-bottom:10px;
}

p{
margin-bottom:20px;
color:#555;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:15px;
font-size:16px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#FFD700;
color:#800000;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<p>
Enter your registered email.
</p>

<input
type="email"
id="email"
placeholder="Registered Email">

<button onclick="sendResetOtp()">
Send OTP
</button>

</div>

<script>

const SUPABASE_URL="https://rdlliurzgwwfjscgwssa.supabase.co";
const SUPABASE_KEY="sb_publishable_HX1QmjO0SPyW3rUoihZkkQ_tRTE1bLc";

const sb=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function sendResetOtp(){

const email=
document.getElementById("email").value.trim().toLowerCase();

if(!email){

alert("Enter your email.");

return;

}

const response=await fetch(
"https://rdlliurzgwwfjscgwssa.supabase.co/functions/v1/send-otp",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email,

name:"User",

resend:true

})

}

);

const result=await response.json();

if(!response.ok){

alert(result.message||result.error);

return;

}

alert("OTP sent successfully.");

window.location.href=
"verify-reset-otp.html?email="+encodeURIComponent(email);

}

</script>

</body>
</html>
