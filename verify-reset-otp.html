<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify Reset OTP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#600000,#800000,#FFD700);
}

.box{
width:380px;
background:#fff;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
color:#800000;
margin-bottom:10px;
}

p{
margin-bottom:20px;
color:#555;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:18px;
text-align:center;
letter-spacing:5px;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
font-weight:bold;
margin-top:10px;
}

.verifyBtn{
background:#FFD700;
color:#800000;
}

#resend{
background:#800000;
color:#fff;
}
</style>
</head>

<body>

<div class="box">

<h2>Verify OTP</h2>

<p>Enter the OTP sent to your email.</p>

<input
id="otp"
maxlength="6"
placeholder="Enter OTP">

<button
class="verifyBtn"
onclick="verifyOtp()">
Verify OTP
</button>

<button
id="resend"
onclick="resendOtp()"
disabled>
Resend OTP (60)
</button>

</div>

<script>

const email=new URLSearchParams(location.search).get("email");

let countdown=60;

const resendBtn=document.getElementById("resend");

startTimer();

function startTimer(){

resendBtn.disabled=true;

resendBtn.innerText="Resend OTP ("+countdown+")";

const timer=setInterval(()=>{

countdown--;

resendBtn.innerText="Resend OTP ("+countdown+")";

if(countdown<=0){

clearInterval(timer);

resendBtn.disabled=false;

resendBtn.innerText="Resend OTP";

}

},1000);

}

async function verifyOtp(){

const otp=document.getElementById("otp").value.trim();

if(otp.length!==6){

alert("Enter valid OTP");

return;

}

const response=await fetch(
"https://rdlliurzgwwfjscgwssa.supabase.co/functions/v1/verify-otp",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email,
otp
})
}
);

const result=await response.json();

if(!response.ok||!result.success){

alert(result.message||result.error||"Invalid OTP");

return;

}

alert("OTP Verified Successfully");

window.location.href=
"new-password.html?email="+encodeURIComponent(email);

}

async function resendOtp(){

countdown=60;

startTimer();

const response=await fetch(
"https://rdlliurzgwwfjscgwssa.supabase.co/functions/v1/send-otp",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email,
name:"User",
resend:true
})
}
);

const result=await response.json();

if(!response.ok){

alert(result.message||result.error);

return;

}

alert("OTP Sent Again");

}

</script>

</body>
</html>
