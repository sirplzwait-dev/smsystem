<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Email Verification</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#600000,#800000,#FFD700);
}

.box{
width:380px;
background:#fff;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
color:#800000;
margin-bottom:10px;
}

p{
margin-bottom:20px;
color:#555;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:18px;
text-align:center;
letter-spacing:5px;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
font-weight:bold;
margin-top:10px;
}

.verifyBtn{
background:#FFD700;
color:#800000;
}

#resend{
background:#800000;
color:#fff;
}

</style>

</head>

<body>

<div class="box">

<h2>Email Verification</h2>

<p>
Enter the OTP sent to your email.
</p>

<input
id="otp"
maxlength="6"
placeholder="Enter OTP">

<button
class="verifyBtn"
onclick="verifyOtp()">
Verify OTP
</button>

<button
id="resend"
onclick="resendOtp()"
disabled>
Resend OTP (60)
</button>

</div>

<script>

const SUPABASE_URL = "https://rdlliurzgwwfjscgwssa.supabase.co";
const SUPABASE_KEY = "sb_publishable_HX1QmjO0SPyW3rUoihZkkQ_tRTE1bLc";

const sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const params = new URLSearchParams(location.search);

const email = params.get("email");

let countdown = 60;

const resendBtn = document.getElementById("resend");

startTimer();

function startTimer(){

resendBtn.disabled=true;

resendBtn.innerText="Resend OTP ("+countdown+")";

const timer=setInterval(()=>{

countdown--;

resendBtn.innerText="Resend OTP ("+countdown+")";

if(countdown<=0){

clearInterval(timer);

resendBtn.disabled=false;

resendBtn.innerText="Resend OTP";

}

},1000);

}
async function verifyOtp() {

    const otp = document.getElementById("otp").value.trim();

    if (otp.length !== 6) {
        alert("Please enter a valid 6 digit OTP.");
        return;
    }

    const response = await fetch(
        "https://rdlliurzgwwfjscgwssa.supabase.co/functions/v1/verify-otp",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                otp: otp
            })
        }
    );

    const result = await response.json();

    console.log(result);

    if (!response.ok || !result.success) {
        alert(result.message || result.error || "Invalid OTP");
        return;
    }

    alert("Email verified successfully.");

    window.location.href =
        "setup.html?email=" + encodeURIComponent(email);
}

async function resendOtp() {

    resendBtn.disabled = true;

    countdown = 60;
    startTimer();

    const response = await fetch(
        "https://rdlliurzgwwfjscgwssa.supabase.co/functions/v1/send-otp",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                name: "User"
            })
        }
    );

    const result = await response.json();

    if (!response.ok) {
        alert(result.message || result.error || "Failed to resend OTP");
        return;
    }

    alert("A new OTP has been sent to your email.");
}
</script>

</body>

</html>
